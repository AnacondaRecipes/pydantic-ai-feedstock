{% set name = "pydantic-ai" %}
{% set version = "2.59.0" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
    sha256: 2c6086a49fe97a200063a678cd0464f8bd6eae1e89256970a1ec02315f9fd8ae
    folder: pydantic-ai/
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-slim/{{ name.replace('-', '_') }}_slim-{{ version }}.tar.gz
    sha256: ce441e646dd79a8dd80ef19c9f6821d803857f08870b260b61db5e8e7af95010
    folder: pydantic-ai-slim/
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name.split('-')[0] }}-graph/{{ name.split('-')[0] }}_graph-{{ version }}.tar.gz
    sha256: f8cf18e18cdea6c6ee412017373c156e4fadc0b4b205c174d564d878d1765989
    folder: pydantic-graph/
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name.split('-')[0] }}-evals/{{ name.split('-')[0] }}_evals-{{ version }}.tar.gz
    sha256: 0d14d621ec2c85939601414e3541aaed8fcb2adc7cc6e8feeda21beb9025c291
    folder: pydantic-evals/

build:
  number: 0

requirements:
  host:
    - python
  run:
    - python

outputs:
  - name: pydantic-graph
    version: {{ version }}
    script: build_base.sh  # [not win]
    script: build_base.bat  # [win]
    build:
      number: 0
      skip: true  # [py<311]
      script_env:
        - OUTPUT_NAME=pydantic-graph
    requirements:
      host:
        - python
        - pip
        - hatchling
        - uv-dynamic-versioning >=0.7.0
      run:
        - python
        - anyio >=4.7.0
        - logfire-api >=3.14.1
        - pydantic >=2.12
        - typing-inspection >=0.4.0
    test:
      imports:
        - pydantic_graph
      commands:
        - pip check
      requires:
        - pip
    about:
      home: https://pydantic.dev/docs/ai/graph/graph/
      license: MIT
      license_family: MIT
      license_file: pydantic-graph/LICENSE
      summary: Graph and state machine library
      description: |
        PydanticAI is a Python agent framework designed to make it less painful
        to build production grade applications with Generative AI.
      dev_url: https://github.com/pydantic/pydantic-ai
      doc_url: https://pydantic.dev/docs/ai/graph/graph/

  - name: pydantic-ai-slim
    version: {{ version }}
    script: build_base.sh  # [not win]
    script: build_base.bat  # [win]
    build:
      number: 0
      skip: true  # [py<311]
      script_env:
        - OUTPUT_NAME=pydantic-ai-slim
    requirements:
      host:
        - python
        - pip
        - hatchling
        - uv-dynamic-versioning >=0.7.0
      run:
        - python
        - anyio >=4.7.0
        - griffelib >=2.0
        - httpx2 >=2.7
        - pydantic >=2.12
        - {{ pin_subpackage('pydantic-graph', exact=True) }}
        - opentelemetry-api >=1.28.0
        - typing-inspection >=0.4.0
        - genai-prices >=0.1.13
      run_constrained:
        # extra logfire
        - logfire >=4.39.0
        - opentelemetry-instrumentation-httpx >=0.65b0
        # extra openai
        - openai >=3.26.0
        - tiktoken >=0.12.0
        # extra cohere
        - cohere >=0.50.6
        # extra google
        - google-genai >=2.30.0
        # extra anthropic
        - anthropic >=1.12.1
        # extra xai
        - xai-sdk >=1.16.0
        # extra groq
        - groq >=0.25.0
        # extra mistral
        - mistralai >=2.9.2
        # extra bedrock
        - boto3 >=1.42.63
        # extra bedrock-mantle
        - botocore >=1.42.63
        # extra typesafe
        - typesafe-sdk >=0.6.0
        # extra huggingface
        - huggingface-hub >=1.3.4,<2.0.0
        - hf-xet <1.5.0
        # extra sentence-transformers
        - sentence-transformers >=5.2.0
        # extra voyageai
        - voyageai >=0.3.7
        # extra duckduckgo
        - ddgs >=9.0.0
        # extra tavily
        - tavily-python >=0.5.0
        # extra exa
        - exa-py >=2.0.0
        # extra web-fetch
        - markdownify >=1.2
        # extra CLI
        - rich >=13
        - prompt-toolkit >=3
        - argcomplete >=3.5.0
        - pyperclip >=1.9.0
        - pyyaml >=6.0.2
        # extra realtime
        - websockets >=14.0
        # extra mcp
        - fastmcp-slim >3.3.0,<4
        # extra mcp-tasks
        - fastmcp-tasks >=4.0.0b1,<5
        # extra ui
        - starlette >=0.46.2
        # extra ag-ui
        - ag-ui-protocol >=0.1.10,<1
        # extra web
        - uvicorn >=0.38.0
        # extra retries
        - tenacity >=8.2.3
        - httpx >=0.27
        # extra temporal
        - temporalio >=1.27.0
        # extra dbos
        - dbos >=2.10.0
        # extra perfect
        - perfect >=3.7.5
    test:
      imports:
        - pydantic_ai
      commands:
        - pip check
      requires:
        - pip
    about:
      home: https://pydantic.dev/docs/ai/overview/
      license: MIT
      license_family: MIT
      license_file: pydantic-ai-slim/LICENSE
      summary: AI Agent Framework, the Pydantic way, slim package
      description: |
        PydanticAI is a Python agent framework designed to make it less painful
        to build production grade applications with Generative AI.
      dev_url: https://github.com/pydantic/pydantic-ai
      doc_url: https://pydantic.dev/docs/ai/overview/install/#slim-install

  - name: pydantic-ai
    version: {{ version }}
    script: build_base.sh  # [not win]
    script: build_base.bat  # [win]
    build:
      number: 0
      skip: true  # [py<311]
      script_env:
        - OUTPUT_NAME=pydantic-ai
    requirements:
      host:
        - python
        - pip
        - hatchling
        - uv-dynamic-versioning >=0.7.0
      run:
        - python
        - {{ pin_subpackage('pydantic-ai-slim', exact=True) }}
        # hatchling generates the `pai` console script from [project.scripts] in
        # every install, but its imports live in upstream's `cli` extra. Pull
        # them in here so `pai` works out of the box; drop these and rely on the
        # `clai` package once it lands on the main channel.
        - argcomplete >=3.5.0
        - prompt-toolkit >=3
        - pyperclip >=1.9.0
        - rich >=13
        - pyyaml >=6.0.2
      run_constrained:
        - pydantic-ai-examples =={{version}}
    test:
      imports:
        - pydantic_ai
      commands:
        - pip check
        # `pai` is the packaged console script, but on Windows the pip-generated
        # Scripts\pai.exe embeds the build-time interpreter path and is not
        # rewritten at install, so it cannot run. Exercise the CLI through the
        # module instead, which covers the same imports on every platform.
        - python -m pydantic_ai --help
      requires:
        - pip
    about:
      home: https://pydantic.dev/docs/ai/
      license: MIT
      license_family: MIT
      license_file: pydantic-ai/LICENSE
      summary: AI Agent Framework, the Pydantic way
      description: |
        PydanticAI is a Python agent framework designed to make it less painful
        to build production grade applications with Generative AI.
      dev_url: https://github.com/pydantic/pydantic-ai
      doc_url: https://pydantic.dev/docs/ai/

  - name: pydantic-evals
    version: {{ version }}
    script: build_base.sh  # [not win]
    script: build_base.bat  # [win]
    build:
      number: 0
      skip: true  # [py<311]
      script_env:
        - OUTPUT_NAME=pydantic-evals
    requirements:
      host:
        - python
        - pip
        - hatchling
        - uv-dynamic-versioning >=0.7.0
      run:
        - python
        - rich >=13.9.4
        - logfire-api >=3.14.1
        - pydantic >=2.12
        - {{ pin_subpackage('pydantic-ai-slim', exact=True) }}
        - anyio >=4.7.0
        - pyyaml >=6.0.2
      run_constrained:
        # extra logfire
        - logfire >=3.14.1
    test:
      imports:
        - pydantic_evals
      commands:
        - pip check
      requires:
        - pip
    about:
      home: https://pydantic.dev/docs/ai/evals/evals/
      license: MIT
      license_family: MIT
      license_file: pydantic-evals/LICENSE
      summary: Framework for evaluating stochastic code execution, especially code making use of LLMs
      description: |
        PydanticAI is a Python agent framework designed to make it less painful
        to build production grade applications with Generative AI.
      dev_url: https://github.com/pydantic/pydantic-ai
      doc_url: https://pydantic.dev/docs/ai/evals/evals/

about:
  home: https://pydantic.dev/docs/ai/overview/
  license: MIT
  license_family: MIT
  summary: Agent Framework / shim to use Pydantic with LLMs.
  description: |
    PydanticAI is a Python agent framework designed to make it less painful
    to build production grade applications with Generative AI.
  dev_url: https://github.com/pydantic/pydantic-ai
  doc_url: https://pydantic.dev/docs/ai/overview/

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
  skip-lints:
    - missing_python_build_tool
    - wrong_output_script_key
