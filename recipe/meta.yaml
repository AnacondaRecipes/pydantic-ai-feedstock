{% set name = "pydantic-ai" %}
{% set version = "2.56.0" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
    sha256: 2553f396e9478a4f0d7f60762bb7ba686837cb765310c2d8328cf56a299455a0
    folder: pydantic-ai/
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-slim/{{ name.replace('-', '_') }}_slim-{{ version }}.tar.gz
    sha256: 58e8a3381749d448a7409f6cbf7acd13fa0549fa6668aa06a13e89695fe5f6a6
    folder: pydantic-ai-slim/
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name.split('-')[0] }}-graph/{{ name.split('-')[0] }}_graph-{{ version }}.tar.gz
    sha256: d740518239671dcc1a160a73116ca16795889b54ae5e7d6c3e98e899881fb2bf
    folder: pydantic-graph/
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name.split('-')[0] }}-evals/{{ name.split('-')[0] }}_evals-{{ version }}.tar.gz
    sha256: fdcd90326eccaffb539cb991381ea79152f792e6f6226416ee73d7fec92da18b
    folder: pydantic-evals/

build:
  number: 0

requirements:
  host:
    - python
  run:
    - python

outputs:
  - name: pydantic-graph
    version: {{ version }}
    script: build_base.sh  # [not win]
    script: build_base.bat  # [win]
    build:
      number: 0
      skip: true  # [py<310]
      script_env:
        - OUTPUT_NAME=pydantic-graph
    requirements:
      host:
        - python
        - pip
        - hatchling
        - uv-dynamic-versioning >=0.7.0
      run:
        - python
        - anyio >=4.7.0
        - logfire-api >=3.14.1
        - pydantic >=2.12
        - typing-inspection >=0.4.0
    test:
      imports:
        - pydantic_graph
      commands:
        - pip check
      requires:
        - pip
    about:
      home: https://pydantic.dev/docs/ai/graph/graph/
      license: MIT
      license_family: MIT
      license_file: pydantic-graph/LICENSE
      summary: Graph and state machine library
      description: |
        PydanticAI is a Python agent framework designed to make it less painful
        to build production grade applications with Generative AI.
      dev_url: https://github.com/pydantic/pydantic-ai
      doc_url: https://pydantic.dev/docs/ai/graph/graph/
  - name: pydantic-ai-slim
    version: {{ version }}
    script: build_base.sh  # [not win]
    script: build_base.bat  # [win]
    build:
      number: 0
      skip: true  # [py<310]
      script_env:
        - OUTPUT_NAME=pydantic-ai-slim
    requirements:
      host:
        - python
        - pip
        - hatchling
        - uv-dynamic-versioning >=0.7.0
      run:
        - python
        - anyio >=4.7.0
        - griffelib >=2.0
        - httpx2 >=2.7
        - pydantic >=2.12
        - {{ pin_subpackage('pydantic-graph', exact=True) }}
        - exceptiongroup >=1.2.2  # [py<311]
        - opentelemetry-api >=1.28.0
        - typing-inspection >=0.4.0
        - genai-prices >=0.1.6
    test:
      imports:
        - pydantic_ai
      commands:
        - pip check
      requires:
        - pip
    about:
      home: https://pydantic.dev/docs/ai/overview/
      license: MIT
      license_family: MIT
      license_file: pydantic-ai-slim/LICENSE
      summary: AI Agent Framework, the Pydantic way, slim package
      description: |
        PydanticAI is a Python agent framework designed to make it less painful
        to build production grade applications with Generative AI.
      dev_url: https://github.com/pydantic/pydantic-ai
      doc_url: https://pydantic.dev/docs/ai/overview/install/#slim-install
  - name: pydantic-ai
    version: {{ version }}
    script: build_base.sh  # [not win]
    script: build_base.bat  # [win]
    build:
      number: 0
      skip: true  # [py<310]
      script_env:
        - OUTPUT_NAME=pydantic-ai
    requirements:
      host:
        - python
        - pip
        - hatchling
        - uv-dynamic-versioning >=0.7.0
      run:
        - python
        - {{ pin_subpackage('pydantic-ai-slim', exact=True) }}
        # hatchling generates the `pai` console script from [project.scripts] in
        # every install, but its imports live in upstream's `cli` extra. Pull
        # them in here so `pai` works out of the box; drop these and rely on the
        # `clai` package once it lands on the main channel.
        - argcomplete >=3.5.0
        - prompt-toolkit >=3
        - pyperclip >=1.9.0
        - rich >=13
    test:
      imports:
        - pydantic_ai
      commands:
        - pip check
        # `pai` is the packaged console script, but on Windows the pip-generated
        # Scripts\pai.exe embeds the build-time interpreter path and is not
        # rewritten at install, so it cannot run. Exercise the CLI through the
        # module instead, which covers the same imports on every platform.
        - python -m pydantic_ai --help
      requires:
        - pip
    about:
      home: https://pydantic.dev/docs/ai/
      license: MIT
      license_family: MIT
      license_file: pydantic-ai/LICENSE
      summary: AI Agent Framework, the Pydantic way
      description: |
        PydanticAI is a Python agent framework designed to make it less painful
        to build production grade applications with Generative AI.
      dev_url: https://github.com/pydantic/pydantic-ai
      doc_url: https://pydantic.dev/docs/ai/
  - name: pydantic-evals
    version: {{ version }}
    script: build_base.sh  # [not win]
    script: build_base.bat  # [win]
    build:
      number: 0
      skip: true  # [py<310]
      script_env:
        - OUTPUT_NAME=pydantic-evals
    requirements:
      host:
        - python
        - pip
        - hatchling
        - uv-dynamic-versioning >=0.7.0
      run:
        - python
        - rich >=13.9.4
        - logfire-api >=3.14.1
        - pydantic >=2.12
        - {{ pin_subpackage('pydantic-ai-slim', exact=True) }}
        - anyio >=4.7.0
        - pyyaml >=6.0.2
    test:
      imports:
        - pydantic_evals
      commands:
        - pip check
      requires:
        - pip
    about:
      home: https://pydantic.dev/docs/ai/evals/evals/
      license: MIT
      license_family: MIT
      license_file: pydantic-evals/LICENSE
      summary: Framework for evaluating stochastic code execution, especially code making use of LLMs
      description: |
        PydanticAI is a Python agent framework designed to make it less painful
        to build production grade applications with Generative AI.
      dev_url: https://github.com/pydantic/pydantic-ai
      doc_url: https://pydantic.dev/docs/ai/evals/evals/

about:
  home: https://pydantic.dev/docs/ai/overview/
  license: MIT
  license_family: MIT
  summary: Agent Framework / shim to use Pydantic with LLMs.
  description: |
    PydanticAI is a Python agent framework designed to make it less painful
    to build production grade applications with Generative AI.
  dev_url: https://github.com/pydantic/pydantic-ai
  doc_url: https://pydantic.dev/docs/ai/overview/

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
  skip-lints:
    - missing_python_build_tool
    - wrong_output_script_key
